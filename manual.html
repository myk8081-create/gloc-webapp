<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLOC 매뉴얼 선택</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      :root {
        --green: #cf4e42;
        --green-dark: #0f1110;
        --mint: #d9a84f;
        --gold-strong: #f4ce78;
        --gold-soft: rgba(217, 168, 79, 0.18);
        --line: #3b3631;
        --ink: #f1eee8;
        --muted: #b6aca1;
        --paper: #1c201e;
        --bg: #0f1110;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 42px;
      }

      .brand-mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background: #111312;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .brand strong {
        display: block;
        font-size: 20px;
      }

      .brand span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(34px, 9vw, 58px);
        line-height: 1.08;
      }

      .lead {
        max-width: 680px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.65;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        display: block;
        min-height: 210px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        background: var(--paper);
        text-decoration: none;
      }

      .card:hover {
        border-color: var(--green);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        color: var(--green-dark);
        background: var(--mint);
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
      }

      h2 {
        margin: 18px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .button-text {
        display: inline-block;
        margin-top: 22px;
        min-height: 42px;
        padding: 9px 16px;
        border: 1px solid rgba(255, 225, 160, 0.72);
        border-radius: 8px;
        color: #18120b;
        background: linear-gradient(180deg, var(--gold-strong), var(--mint));
        font-weight: 900;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
      }

      @media (max-width: 720px) {
        main {
          padding: 28px 0;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .card {
          min-height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="brand-mark">
          <img src="./gloc-logo.png" alt="GLOC 로고" onerror="this.onerror=null; this.src='../gloc-logo.png';" />
        </div>
        <div>
          <strong>GLOC</strong>
          <span>재고관리 매뉴얼</span>
        </div>
      </div>

      <h1>사용할 매뉴얼을 선택하세요</h1>
      <p class="lead">휴대폰에서도 볼 수 있는 온라인 매뉴얼입니다. 본사 담당자는 본사용을, 대리점과 샵은 대리점/샵용을 선택하세요.</p>

      <div class="grid">
        <a class="card" href="./manual-admin.html">
          <span class="badge">본사</span>
          <h2>본사 관리자 매뉴얼</h2>
          <p>대리점 계정, 제품, 본사 재고, 전체 재고 조회, 발주 상태, QR 안내문을 관리합니다.</p>
          <span class="button-text">본사용 열기</span>
        </a>

        <a class="card" href="./manual-dealer.html">
          <span class="badge">대리점/샵</span>
          <h2>대리점/샵 매뉴얼</h2>
          <p>재고 조회, 내 재고 수정, 발주 신청, 내 발주 확인, 문제 발생 시 문의 방법을 확인합니다.</p>
          <span class="button-text">대리점/샵용 열기</span>
        </a>
      </div>
    </main>
  </body>
</html>
