<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLOC 매뉴얼 선택</title>
    <style>
      :root {
        --green: #117a63;
        --green-dark: #0c4f41;
        --mint: #eaf5f1;
        --line: #cfe2dc;
        --ink: #1c2b28;
        --muted: #62736e;
        --bg: #f5faf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 42px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 2px solid var(--green);
        border-radius: 50%;
        color: var(--green);
        font-weight: 900;
      }

      .brand strong {
        display: block;
        font-size: 20px;
      }

      .brand span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(34px, 9vw, 58px);
        line-height: 1.08;
      }

      .lead {
        max-width: 680px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.65;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        display: block;
        min-height: 210px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        background: #ffffff;
        text-decoration: none;
      }

      .card:hover {
        border-color: var(--green);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        color: var(--green-dark);
        background: var(--mint);
        font-size: 13px;
        font-weight: 900;
      }

      h2 {
        margin: 18px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .button-text {
        display: inline-block;
        margin-top: 22px;
        color: var(--green);
        font-weight: 900;
      }

      @media (max-width: 720px) {
        main {
          padding: 28px 0;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .card {
          min-height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <strong>GLOC</strong>
          <span>재고관리 매뉴얼</span>
        </div>
      </div>

      <h1>사용할 매뉴얼을 선택하세요</h1>
      <p class="lead">휴대폰에서도 볼 수 있는 온라인 매뉴얼입니다. 본사 담당자는 본사용을, 대리점과 샵은 대리점/샵용을 선택하세요.</p>

      <div class="grid">
        <a class="card" href="./manual-admin.html">
          <span class="badge">본사</span>
          <h2>본사 관리자 매뉴얼</h2>
          <p>대리점 계정, 제품, 본사 재고, 전체 재고 조회, 발주 상태, QR 안내문을 관리합니다.</p>
          <span class="button-text">본사용 열기</span>
        </a>

        <a class="card" href="./manual-dealer.html">
          <span class="badge">대리점/샵</span>
          <h2>대리점/샵 매뉴얼</h2>
          <p>재고 조회, 내 재고 수정, 발주 신청, 내 발주 확인, 문제 발생 시 문의 방법을 확인합니다.</p>
          <span class="button-text">대리점/샵용 열기</span>
        </a>
      </div>
    </main>
  </body>
</html>
